name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

  release:
    name: Build & Release (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rhizometrack
            asset_name: rhizometrack-linux-amd64
          - os: macOS-latest
            target: aarch64-apple-darwin
            artifact_name: rhizometrack
            asset_name: rhizometrack-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle (macOS only)
        if: matrix.os == 'macOS-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle

      - name: Build Release (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build and Bundle Release (macOS)
        if: matrix.os == 'macOS-latest'
        run: cargo bundle --release --target ${{ matrix.target }}

      - name: Prepare Binary Artifact
        id: prepare
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "macOS-latest" ]]; then
            cd target/${{ matrix.target }}/release/bundle/osx/

            tar -czf $GITHUB_WORKSPACE/${{ matrix.asset_name }}.tar.gz *.app

            echo "asset_path=${{ matrix.asset_name }}.tar.gz" >> $GITHUB_OUTPUT
          else
            cd target/${{ matrix.target }}/release/

            mv ${{ matrix.artifact_name }} $GITHUB_WORKSPACE/${{ matrix.asset_name }}

            echo "asset_path=${{ matrix.asset_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: newest
          name: Latest Main Build
          files: ${{ steps.prepare.outputs.asset_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
