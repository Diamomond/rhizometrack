[package]
name = "rhizometrack"
version = "1.0.0"
edition = "2026"
authors = ["Momo"]

[dependencies]
iced = { version = "0.13", features = ["tokio", "image"] }
rfd = "0.15"

chrono = { version = "0.4", features = ["serde"] }

rusqlite = { version = "0.37", features = ["bundled"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.bundle]
name = "rhizometrack"
identifier = "com.Momo.rhizometrack"
